<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Approval Flow</title>
<meta name="description" content="How fee discount approvals work in the GEMS admissions CRM, for Principals and Heads of School.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--ink:#1a2238;--muted:#4a5578}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,sans-serif}
.wrap{max-width:1600px;margin:0 auto;padding:14px 16px 16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
h1{margin:0;font-size:22px;color:var(--navy);letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.rule{background:#fff4e0;border:2px solid #c2620a;color:#8a3b00;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;max-width:560px}
.chart{overflow-x:auto}
.chart svg{display:block;width:auto;max-width:100%;height:calc(100vh - 150px);min-height:600px;margin:0 auto}
@media (max-width:900px){.chart svg{height:auto;width:100%;min-width:900px;max-width:none}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px}.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.actions{font-size:13px}
.actions button{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.actions a{color:var(--navy);margin-left:12px}
@page{size:A4 landscape;margin:9mm 10mm}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:0;max-width:none}.actions{display:none}header{flex-wrap:nowrap;align-items:center;margin-bottom:5mm;padding-bottom:3mm;border-bottom-width:2px}h1{font-size:15pt;white-space:nowrap}.sub{font-size:10pt}.rule{font-size:9pt;padding:2mm 3mm;max-width:100mm}.chart{overflow:visible}.chart svg{min-width:0;min-height:0;max-width:none;width:100%;height:auto;max-height:158mm;margin:0 auto}.foot{justify-content:center;margin-top:3mm}.legend{justify-content:center;margin-top:3mm;font-size:9pt;gap:6mm}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Fee discount approval in the GEMS Admissions CRM</h1>
    <p class="sub">For Principals and Heads of School</p>
  </div>
  <div class="rule">Every fee discount quoted to a parent must be approved by the Principal in the CRM before it is confirmed to the parent.</div>
</header>
<div class="chart">
<svg viewBox="0 0 1520 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discount approval flowchart" font-family="Inter, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a5c"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1c1c"/></marker></defs>
<rect x="6" y="6" width="1508" height="848" rx="12" fill="#f3f5fb" stroke="#c9d1e6" stroke-width="1.5"/>
<rect x="20.0" y="134.0" width="210" height="72" rx="36.0" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/>
<text x="125" y="155.2" text-anchor="middle" font-size="16.5" fill="#fff"><tspan x="125" dy="0.0" font-weight="700" font-size="16.5" fill="#fff">Parent has visited</tspan><tspan x="125" dy="20.6" font-weight="700" font-size="16.5" fill="#fff">the campus</tspan><tspan x="125" dy="20.6" font-weight="500" font-size="13.200000000000001" fill="#d9e0f2">status: Visit Done</tspan></text>
<rect x="255.0" y="130.0" width="230" height="80" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="370" y="156.1" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="370" dy="0.0" font-weight="600" font-size="15.400000000000002" fill="#1a2238">Counsellor selects</tspan><tspan x="370" dy="19.3" font-weight="600" font-size="15.400000000000002" fill="#1a2238">grade and board</tspan><tspan x="370" dy="19.3" font-weight="500" font-size="13.200000000000001" fill="#4a5578">fee grid loads in the CRM</tspan></text>
<polygon points="600,108.0 700.0,170 600,232.0 500.0,170" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="600" y="165.8" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="600" dy="0.0" font-weight="600" font-size="15.400000000000002" fill="#1a2238">Any discount</tspan><tspan x="600" dy="19.3" font-weight="600" font-size="15.400000000000002" fill="#1a2238">to be offered?</tspan></text>
<rect x="485.0" y="280.0" width="230" height="60" rx="30.0" fill="#eef0f4" stroke="#1b2a5c" stroke-width="2"/>
<text x="600" y="305.5" text-anchor="middle" font-size="16.5" fill="#3b4256"><tspan x="600" dy="0.0" font-weight="700" font-size="14.850000000000001" fill="#3b4256">No approval needed</tspan><tspan x="600" dy="20.6" font-weight="500" font-size="13.200000000000001" fill="#3b4256">proceed at the full fee</tspan></text>
<rect x="725.0" y="108.0" width="280" height="124" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="865" y="136.9" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="865" dy="0.0" font-weight="700" font-size="15.400000000000002" fill="#1a2238">Counsellor enters the</tspan><tspan x="865" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">discount on Application Fee,</tspan><tspan x="865" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">Admission Blocking Fee and</tspan><tspan x="865" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">Tuition Fee: amount + reason</tspan><tspan x="865" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">for each, then Saves</tspan></text>
<rect x="1040.0" y="128.0" width="240" height="84" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="1160" y="156.1" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="1160" dy="0.0" font-weight="700" font-size="15.400000000000002" fill="#1a2238">Approval request goes</tspan><tspan x="1160" dy="19.3" font-weight="700" font-size="15.400000000000002" fill="#1a2238">automatically to the</tspan><tspan x="1160" dy="19.3" font-weight="500" font-size="13.750000000000002" fill="#4a5578">approvers in the CRM</tspan></text>
<rect x="1010.0" y="268.0" width="300" height="64" rx="6" fill="#fff4e0" stroke="#c2620a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="1160" y="295.8" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="1160" dy="0.0" font-weight="800" font-size="14.850000000000001" fill="#8a3b00">⚠  Do NOT confirm the discount</tspan><tspan x="1160" dy="19.3" font-weight="700" font-size="14.3" fill="#8a3b00">to the parent until it is approved</tspan></text>
<polygon points="1160,389.0 1295.0,455 1160,521.0 1025.0,455" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="1160" y="441.1" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="1160" dy="0.0" font-weight="800" font-size="13.750000000000002" fill="#1b2a5c">Level 1 *</tspan><tspan x="1160" dy="19.3" font-weight="700" font-size="14.850000000000001" fill="#1a2238">Principal / School</tspan><tspan x="1160" dy="19.3" font-weight="700" font-size="14.850000000000001" fill="#1a2238">Head approves?</tspan></text>
<polygon points="860,389.0 980.0,455 860,521.0 740.0,455" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="860" y="441.1" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="860" dy="0.0" font-weight="800" font-size="13.750000000000002" fill="#1b2a5c">Level 2</tspan><tspan x="860" dy="19.3" font-weight="700" font-size="14.850000000000001" fill="#1a2238">Finance</tspan><tspan x="860" dy="19.3" font-weight="700" font-size="14.850000000000001" fill="#1a2238">approves?</tspan></text>
<rect x="440.0" y="413.0" width="250" height="84" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="565" y="441.1" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="565" dy="0.0" font-weight="700" font-size="15.400000000000002" fill="#1a2238">Commitment email</tspan><tspan x="565" dy="19.3" font-weight="500" font-size="13.750000000000002" fill="#1a2238">to the parent from the CRM</tspan><tspan x="565" dy="19.3" font-weight="500" font-size="13.200000000000001" fill="#4a5578">exact approved amounts</tspan></text>
<rect x="135.0" y="417.0" width="250" height="76" rx="38.0" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/>
<text x="260" y="440.1" text-anchor="middle" font-size="16.5" fill="#fff"><tspan x="260" dy="0.0" font-weight="700" font-size="16.5" fill="#fff">Parent proceeds</tspan><tspan x="260" dy="20.6" font-weight="500" font-size="13.200000000000001" fill="#d9e0f2">application, admission</tspan><tspan x="260" dy="20.6" font-weight="500" font-size="13.200000000000001" fill="#d9e0f2">blocking fee, enrolment</tspan></text>
<polyline points="230,170 253,170" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="485,170 498,170" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="700,170 723,170" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="711" y="160" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="600,232 600,278" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="618" y="262" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">No</text>
<polyline points="1005,170 1038,170" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="1160,212 1160,266" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="1160,332 1160,387" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="1025,455 982,455" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="1003" y="445" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="740,455 692,455" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="716" y="445" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="440,455 387,455" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<rect x="1045.0" y="615.0" width="230" height="70" rx="6" fill="#fdecec" stroke="#9b1c1c" stroke-width="2"/>
<text x="1160" y="645.8" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="1160" dy="0.0" font-weight="800" font-size="16.5" fill="#9b1c1c">Rejected</tspan><tspan x="1160" dy="19.3" font-weight="500" font-size="13.200000000000001" fill="#5b2020">counsellor sees the reason</tspan></text>
<polyline points="1160,521 1160,613" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="1178" y="575" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">No</text>
<polyline points="860,521 860,650 1043,650" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="878" y="575" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">No</text>
<rect x="1300.0" y="595.0" width="200" height="110" rx="6" fill="#fff" stroke="#9b1c1c" stroke-width="2"/>
<text x="1400" y="626.5" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="1400" dy="0.0" font-weight="700" font-size="15.400000000000002" fill="#1a2238">Counsellor discusses</tspan><tspan x="1400" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">with the parent: revise</tspan><tspan x="1400" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">the discount or offer</tspan><tspan x="1400" dy="19.3" font-weight="500" font-size="15.400000000000002" fill="#1a2238">the full fee</tspan></text>
<polyline points="1275,650 1298,650" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<polyline points="1400,595 1400,60 865,60 865,106" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="1130" y="52" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">resubmit</text>
<rect x="65.0" y="590.0" width="420" height="200" rx="6" fill="#fff" stroke="#8e9ac0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="275" y="618.4" text-anchor="middle" font-size="15.400000000000002" fill="#1a2238"><tspan x="275" dy="0.0" font-weight="800" font-size="16.5" fill="#1b2a5c">The Principal&#x27;s role</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">• Every discount request for your school</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">   comes to you in the CRM.</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">• Check the amount and reason for each</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">   fee, then approve or reject.</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">• If you reject, give a reason so the</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">   counsellor can speak to the parent.</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">* Coimbatore has no principal, so requests</tspan><tspan x="275" dy="19.3" font-weight="500" font-size="14.3" fill="#1a2238">   go straight to Finance.</tspan></text>
</svg>
</div>
<div class="foot"><div class="legend">
  <span><svg width="44" height="20"><rect x="1" y="1" width="42" height="18" rx="9" fill="#1b2a5c"/></svg>Start / end</span>
  <span><svg width="44" height="20"><rect x="1" y="1" width="42" height="18" rx="3" fill="#fff" stroke="#1b2a5c" stroke-width="2"/></svg>Step</span>

</div>
<div class="actions"><button onclick="window.print()">Print or save as PDF</button></div></div>
</div>
</body>
</html>
