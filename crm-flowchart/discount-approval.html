<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discount Approval Flow</title>
<meta name="description" content="How fee discount approvals work in the GEMS admissions CRM, for Principals and Heads of School.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../assets/img/favicon-64.png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a5c;--ink:#1a2238;--muted:#4a5578}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Inter,Arial,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:14px 16px 16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:3px solid var(--navy);padding-bottom:8px;margin-bottom:10px;flex-wrap:wrap}
h1{margin:0;font-size:22px;color:var(--navy);letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.rule{background:#fff4e0;border:2px solid #c2620a;color:#8a3b00;border-radius:8px;padding:8px 14px;font-weight:700;font-size:14px;max-width:560px}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;height:auto;margin:0 auto}
@media (max-width:900px){.chart svg{height:auto;width:100%;min-width:0;max-width:none}}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:8px}.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.actions{font-size:13px}
.actions button{font:inherit;font-weight:600;background:var(--navy);color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.actions a{color:var(--navy);margin-left:12px}
@page{size:A4 portrait;margin:9mm 10mm}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.wrap{padding:0;max-width:none}.actions{display:none}header{flex-wrap:wrap;align-items:center;margin-bottom:5mm;padding-bottom:3mm;border-bottom-width:2px}h1{font-size:15pt;white-space:nowrap}.sub{font-size:10pt}.rule{font-size:9.5pt;padding:2mm 3mm;max-width:none}.chart{overflow:visible}.chart svg{min-width:0;min-height:0;max-width:none;width:100%;height:auto;max-height:220mm;margin:0 auto}.foot{justify-content:center;margin-top:3mm}.legend{justify-content:center;margin-top:3mm;font-size:9pt;gap:6mm}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>Fee discount approval in the GEMS Admissions CRM</h1>
    <p class="sub">For Principals and Heads of School</p>
  </div>
  <div class="rule">Every fee discount quoted to a parent must be approved by the Principal in the CRM before it is confirmed to the parent.</div>
</header>
<div class="chart">
<svg viewBox="0 0 1000 1300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Discount approval flowchart" font-family="Inter, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a5c"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9b1c1c"/></marker></defs>
<rect x="6" y="6" width="988" height="1288" rx="12" fill="#f3f5fb" stroke="#c9d1e6" stroke-width="1.5"/>
<rect x="195.0" y="38.0" width="330" height="64" rx="32.0" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="65.0" text-anchor="middle" font-size="18.0" fill="#fff"><tspan x="360" dy="0.0" font-weight="700" font-size="18.0" fill="#fff">Parent has visited the campus</tspan><tspan x="360" dy="22.5" font-weight="500" font-size="15.0" fill="#d9e0f2">status: Visit Done</tspan></text>
<rect x="195.0" y="138.0" width="330" height="64" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="165.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="600" font-size="16.8" fill="#1a2238">Counsellor selects grade and board</tspan><tspan x="360" dy="21.0" font-weight="500" font-size="15.0" fill="#4a5578">the fee grid loads in the CRM</tspan></text>
<polygon points="360,240.0 485.0,295 360,350.0 235.0,295" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="290.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="600" font-size="16.8" fill="#1a2238">Any discount to</tspan><tspan x="360" dy="21.0" font-weight="600" font-size="16.8" fill="#1a2238">be offered?</tspan></text>
<rect x="640.0" y="263.0" width="300" height="64" rx="32.0" fill="#eef0f4" stroke="#1b2a5c" stroke-width="2"/>
<text x="790" y="290.1" text-anchor="middle" font-size="18.0" fill="#3b4256"><tspan x="790" dy="0.0" font-weight="700" font-size="16.8" fill="#3b4256">No approval needed</tspan><tspan x="790" dy="22.5" font-weight="500" font-size="15.0" fill="#3b4256">proceed at the full fee</tspan></text>
<rect x="180.0" y="378.0" width="360" height="104" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="404.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="700" font-size="16.8" fill="#1a2238">Counsellor enters the discount</tspan><tspan x="360" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">on Application Fee, Admission</tspan><tspan x="360" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">Blocking Fee and Tuition Fee:</tspan><tspan x="360" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">amount + reason for each, then Saves</tspan></text>
<rect x="180.0" y="518.0" width="360" height="74" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="550.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="700" font-size="16.8" fill="#1a2238">Approval request goes automatically</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="16.8" fill="#1a2238">to the approvers in the CRM</tspan></text>
<rect x="180.0" y="620.0" width="360" height="60" rx="6" fill="#fff4e0" stroke="#c2620a" stroke-width="2" stroke-dasharray="6 4"/>
<text x="360" y="645.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="800" font-size="16.8" fill="#8a3b00">⚠  Do NOT confirm the discount</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="16.2" fill="#8a3b00">to the parent until it is approved</tspan></text>
<polygon points="360,720.0 510.0,790 360,860.0 210.0,790" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="774.9" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="800" font-size="15.6" fill="#1b2a5c">Level 1 *</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="17.4" fill="#1a2238">Principal / School</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="17.4" fill="#1a2238">Head approves?</tspan></text>
<polygon points="360,890.0 510.0,960 360,1030.0 210.0,960" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="944.9" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="800" font-size="15.6" fill="#1b2a5c">Level 2</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="17.4" fill="#1a2238">Finance</tspan><tspan x="360" dy="21.0" font-weight="700" font-size="17.4" fill="#1a2238">approves?</tspan></text>
<rect x="180.0" y="1060.0" width="360" height="70" rx="6" fill="#fff" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="1090.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="360" dy="0.0" font-weight="700" font-size="16.8" fill="#1a2238">Commitment email to the parent</tspan><tspan x="360" dy="21.0" font-weight="500" font-size="15.0" fill="#4a5578">from the CRM, with the exact approved amounts</tspan></text>
<rect x="180.0" y="1173.0" width="360" height="64" rx="32.0" fill="#1b2a5c" stroke="#1b2a5c" stroke-width="2"/>
<text x="360" y="1200.0" text-anchor="middle" font-size="18.0" fill="#fff"><tspan x="360" dy="0.0" font-weight="700" font-size="18.0" fill="#fff">Parent proceeds</tspan><tspan x="360" dy="22.5" font-weight="500" font-size="15.0" fill="#d9e0f2">application, admission blocking fee, enrolment</tspan></text>
<polyline points="360,102 360,138" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="360,202 360,240" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="485,295 640,295" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="510" y="286" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">No</text>
<polyline points="360,350 360,378" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="382" y="368" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="360,482 360,518" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="360,592 360,620" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="360,680 360,720" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="360,860 360,890" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="382" y="880" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="360,1030 360,1060" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<text x="382" y="1050" font-size="13" font-weight="700" fill="#1b2a5c" text-anchor="middle">Yes</text>
<polyline points="360,1130 360,1173" fill="none" stroke="#1b2a5c" stroke-width="2" marker-end="url(#arr)"/>
<rect x="630.0" y="755.0" width="320" height="70" rx="6" fill="#fdecec" stroke="#9b1c1c" stroke-width="2"/>
<text x="790" y="785.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="790" dy="0.0" font-weight="800" font-size="19.2" fill="#9b1c1c">Rejected</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.0" fill="#5b2020">counsellor sees the reason in the CRM</tspan></text>
<polyline points="510,790 630,790" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="532" y="780" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">No</text>
<polyline points="510,960 790,960 790,825" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="532" y="950" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">No</text>
<rect x="650.0" y="562.0" width="280" height="96" rx="6" fill="#fff" stroke="#9b1c1c" stroke-width="2"/>
<text x="790" y="584.4" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="790" dy="0.0" font-weight="700" font-size="16.8" fill="#1a2238">Counsellor discusses with</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">the parent: revise the</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">discount or offer the</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="16.8" fill="#1a2238">full fee</tspan></text>
<polyline points="790,755 790,658" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<polyline points="790,562 790,430 540,430" fill="none" stroke="#9b1c1c" stroke-width="2" marker-end="url(#arrR)"/>
<text x="710" y="421" font-size="13" font-weight="700" fill="#9b1c1c" text-anchor="middle">resubmit</text>
<rect x="640.0" y="1020.0" width="300" height="220" rx="6" fill="#fff" stroke="#8e9ac0" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="790" y="1051.9" text-anchor="middle" font-size="16.8" fill="#1a2238"><tspan x="790" dy="0.0" font-weight="800" font-size="18.0" fill="#1b2a5c">The Principal&#x27;s role</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">• Every discount request for your</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">   school comes to you in the CRM.</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">• Check the amount and reason for</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">   each fee, then approve or reject.</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">• If you reject, give a reason so the</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">   counsellor can speak to the parent.</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">* Coimbatore has no principal, so</tspan><tspan x="790" dy="21.0" font-weight="500" font-size="15.6" fill="#1a2238">   requests go straight to Finance.</tspan></text>
</svg>
</div>
<div class="foot"><div class="legend">
  <span><svg width="44" height="20"><rect x="1" y="1" width="42" height="18" rx="9" fill="#1b2a5c"/></svg>Start / end</span>
  <span><svg width="44" height="20"><rect x="1" y="1" width="42" height="18" rx="3" fill="#fff" stroke="#1b2a5c" stroke-width="2"/></svg>Step</span>
  <span><svg width="30" height="22"><polygon points="15,1 29,11 15,21 1,11" fill="#e6ebf7" stroke="#1b2a5c" stroke-width="2"/></svg>Decision</span>
  
  <span><svg width="44" height="20"><line x1="2" y1="10" x2="42" y2="10" stroke="#9b1c1c" stroke-width="2.5"/></svg>Discount rejected path</span>
</div>
<div class="actions"><button onclick="window.print()">Print or save as PDF</button></div></div>
</div>
</body>
</html>
